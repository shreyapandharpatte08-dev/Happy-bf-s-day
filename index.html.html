<html lang="en">
<head>
<meta charset="UTF-8">

<title>Happy Boyfriends Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#c99a6b; --kraft-dark:#a97c4f; --red:#8f1d1d; --red-deep:#7a1414;
    --cream:#efe6d8; --pink:#f3c6cb; --pink-deep:#e79aa6;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    height:100%; margin:0;
    font-family:'Playfair Display', serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.10), transparent 40%),
      linear-gradient(180deg, #d1a374, #b9865a 60%, #a97646);
    background-attachment:fixed;
    color:var(--red-deep);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #scene{
    --page-w: clamp(118px, 33vw, 270px);
    --gap: clamp(10px, 3vw, 24px);
    position:relative;
    width:calc(var(--page-w) * 2 + var(--gap));
    height:calc(var(--page-w) * 1.5);
    margin-top:clamp(28px, 6vh, 60px);
    display:flex; align-items:flex-start; justify-content:center;
    perspective:2400px;
  }

  /* ---------- COVER ---------- */
  #cover-wrap{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:var(--page-w); height:calc(var(--page-w) * 1.5);
    cursor:pointer;
    transform-style:preserve-3d;
    transform-origin:left center;
    transition:transform .9s cubic-bezier(.62,.06,.24,1), opacity .5s ease .35s;
    z-index:5;
  }
  #cover-wrap.open{ transform:translateX(-50%) rotateY(-155deg); opacity:0; pointer-events:none; }
  #cover-img{
    width:100%; height:100%; object-fit:cover; border-radius:6px;
    box-shadow:0 18px 40px rgba(40,15,10,.45), 0 2px 0 rgba(255,255,255,.15) inset;
    display:block; backface-visibility:hidden;
  }
  #tap-hint{
    position:absolute; bottom:-38px; left:50%; transform:translateX(-50%);
    font-family:'Caveat',cursive; font-size:20px; color:#fff3e6; opacity:.9;
    white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.4);
    animation:bob 1.8s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

  /* ---------- SPREAD ---------- */
  #spread{
    position:absolute; top:0; left:50%; transform:translateX(-50%) scale(.96);
    width:100%; height:100%;
    display:flex; gap:var(--gap);
    opacity:0; pointer-events:none; transition:opacity .5s ease .25s, transform .6s ease .25s;
  }
  #spread.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) scale(1); }
  .page{
    position:relative; width:var(--page-w); height:calc(var(--page-w) * 1.5); flex:none;
    border-radius:8px; overflow:hidden;
    box-shadow:0 16px 34px rgba(40,15,10,.4);
    background-size:cover; background-position:center;
    transform-style:flat;
  }

  #spread:before{
    content:""; position:absolute; top:2%; bottom:2%; left:50%; width:14px;
    transform:translateX(-50%);
    background:linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.28));
    z-index:3; pointer-events:none;
  }

  /* ---------- LETTER ---------- */
  .letter-hit{ position:absolute; inset:0; cursor:pointer; }
  #letter-img{
    position:absolute; left:8%; top:6%; width:84%; height:70%;
    object-fit:cover; border-radius:3px;
    box-shadow:0 10px 24px rgba(40,15,10,.35);
    transform-origin:50% 100%;
    transform:translateY(58%) scale(.7);
    transition:transform .45s ease;
    backface-visibility:hidden;
  }
  #page-left.lifted #letter-img{ transform:translateY(0%) scale(1); }
  #letter-hint{
    position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
    font-family:'Caveat',cursive; font-size:15px; color:var(--red-deep);
    background:rgba(239,230,216,.85); padding:3px 10px; border-radius:20px;
    pointer-events:none;
  }

  /* ---------- CANDLES ---------- */
  .flame{
    position:absolute; width:8.3%; transform-origin:50% 92%;
    filter:drop-shadow(0 2px 3px rgba(60,10,0,.3));
    animation:flicker 1.6s ease-in-out infinite;
  }
  @keyframes flicker{0%,100%{transform:rotate(-2deg) scaleY(1)}50%{transform:rotate(2deg) scaleY(1.04)}}
  .flame.blowing{ animation:none; transform:rotate(var(--tilt,38deg)) scaleY(.8) translateX(6px); transition:transform .12s ease-out; }
  .flame.out{ opacity:0; transform:rotate(60deg) scaleY(.3); transition:opacity .35s ease, transform .35s ease; }

  #meter-wrap{
    position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
    width:82%; display:flex; flex-direction:column; align-items:center; gap:5px;
    z-index:4;
  }
  #meter-track{ width:100%; height:9px; border-radius:6px; background:rgba(255,255,255,.35); overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.25);}
  #meter-fill{ height:100%; width:0%; background:linear-gradient(90deg,#f3b13a,var(--red)); transition:width .06s linear; }
  #mic-status{ font-family:'Caveat',cursive; font-size:15px; color:var(--red-deep); text-align:center; background:rgba(239,230,216,.85); padding:2px 10px; border-radius:20px;}
  #blow-btn{
    margin-top:2px; font-family:'Playfair Display',serif; font-weight:700; font-size:13px;
    border:none; background:var(--red); color:#fff8ef; padding:8px 16px; border-radius:20px;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.25); letter-spacing:.02em;
  }
  #blow-btn:active{ transform:scale(.96); }

  #wish{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; gap:14px; opacity:0; pointer-events:none;
    transition:opacity .5s ease; z-index:6; padding:10%;
  }
  #wish.show{ opacity:1; pointer-events:auto; }
  #wish h2{ font-family:'Caveat',cursive; font-size:clamp(28px,6vw,40px); color:var(--red-deep); margin:0; text-shadow:0 2px 0 rgba(255,255,255,.4);}
  #relight-btn{
    font-family:'Playfair Display',serif; font-weight:700; font-size:13px;
    border:2px solid var(--red-deep); background:rgba(239,230,216,.92); color:var(--red-deep);
    padding:8px 18px; border-radius:20px; cursor:pointer;
  }

  /* ---------- BACK BUTTON ---------- */
  #back-btn{
    position:absolute; top:-42px; left:50%; transform:translateX(-50%);
    font-family:'Caveat',cursive; font-size:19px; color:#fff3e6; background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.4); padding:4px 16px; border-radius:20px;
    cursor:pointer; opacity:0; pointer-events:none; transition:opacity .4s ease .3s;
    z-index:8;
  }
  #back-btn.show{ opacity:1; pointer-events:auto; }

  #note{
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:11px; color:rgba(255,255,255,.55); font-family:sans-serif; text-align:center; width:92%;
  }

  canvas#confetti{ position:absolute; inset:0; pointer-events:none; z-index:7; }

  @media (max-width:480px){
    #letter-hint{ font-size:12px; padding:2px 8px; }
    #mic-status{ font-size:13px; }
  }
</style>

<script>
(function(){
  const coverWrap = document.getElementById('cover-wrap');
  const spread = document.getElementById('spread');
  const backBtn = document.getElementById('back-btn');
  const pageLeft = document.getElementById('page-left');
  const letterHit = document.getElementById('letter-hit');
  const letterHint = document.getElementById('letter-hint');

  function openCard(){
    coverWrap.classList.add('open');
    spread.classList.add('show');
    backBtn.classList.add('show');
  }
  function closeCard(){
    coverWrap.classList.remove('open');
    spread.classList.remove('show');
    backBtn.classList.remove('show');
    pageLeft.classList.remove('lifted');
  }
  coverWrap.addEventListener('click', openCard);
  backBtn.addEventListener('click', closeCard);

  pageLeft.addEventListener('click', () => {
    pageLeft.classList.toggle('lifted');
    letterHint.style.display = pageLeft.classList.contains('lifted') ? 'none' : 'block';
  });

  // ---------------- CANDLES ----------------
  const flames = Array.from(document.querySelectorAll('.flame'));
  const meterFill = document.getElementById('meter-fill');
  const micStatus = document.getElementById('mic-status');
  const blowBtn = document.getElementById('blow-btn');
  const wish = document.getElementById('wish');
  const relightBtn = document.getElementById('relight-btn');
  const confettiCanvas = document.getElementById('confetti');
  const ctx = confettiCanvas.getContext('2d');

  let audioCtx, analyser, dataArray, rafId, micActive = false;
  let blowStart = null;
  let extinguished = false;
  let fallbackBlowing = false;

  function setLevel(v){
    meterFill.style.width = Math.min(100, v*100) + '%';
  }

  async function initMic(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.6;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      micActive = true;
      micStatus.textContent = 'listening… blow into your mic 🎤';
      loop();
    }catch(e){
      micStatus.textContent = 'mic unavailable — hold the button below to blow';
    }
  }

  function loop(){
    rafId = requestAnimationFrame(loop);
    if(!analyser || extinguished) return;
    analyser.getByteFrequencyData(dataArray);
    // "blowing" reads mostly as low-frequency broadband energy; average the lower half of bins
    let sum = 0, n = Math.floor(dataArray.length*0.5);
    for(let i=0;i<n;i++) sum += dataArray[i];
    const level = (sum/n)/255;
    setLevel(level);
    const BLOW_THRESHOLD = 0.16;
    handleBlowSample(level > BLOW_THRESHOLD, level);
  }

  function handleBlowSample(isBlowing, level){
    if(isBlowing){
      if(!blowStart) blowStart = performance.now();
      flames.forEach((f,i) => {
        f.classList.add('blowing');
        f.style.setProperty('--tilt', (30 + Math.min(30, level*70) + i*2) + 'deg');
      });
      if(performance.now() - blowStart > 500){
        extinguishAll();
      }
    } else {
      blowStart = null;
      flames.forEach(f => f.classList.remove('blowing'));
    }
  }

  function extinguishAll(){
    if(extinguished) return;
    extinguished = true;
    flames.forEach(f => { f.classList.remove('blowing'); f.classList.add('out'); });
    micStatus.textContent = 'the candles are out 🌙';
    setLevel(0);
    setTimeout(() => { wish.classList.add('show'); launchConfetti(); }, 400);
  }

  function relight(){
    extinguished = false;
    flames.forEach(f => { f.classList.remove('out'); f.classList.remove('blowing'); });
    wish.classList.remove('show');
    blowStart = null;
    micStatus.textContent = micActive ? 'listening… blow into your mic 🎤' : 'hold the button below to blow';
  }
  relightBtn.addEventListener('click', relight);

  // ---- Fallback: hold button or spacebar ----
  let fallbackRaf;
  function fallbackTick(){
    fallbackRaf = requestAnimationFrame(fallbackTick);
    if(!fallbackBlowing || extinguished){ return; }
    const level = 0.55 + Math.random()*0.25;
    setLevel(level);
    handleBlowSample(true, level);
  }
  fallbackTick();

  function startFallback(){
    if(extinguished) return;
    fallbackBlowing = true;
  }
  function stopFallback(){
    fallbackBlowing = false;
    blowStart = null;
    setLevel(0);
    flames.forEach(f => f.classList.remove('blowing'));
  }
  blowBtn.addEventListener('mousedown', startFallback);
  blowBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); startFallback();}, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => blowBtn.addEventListener(ev, stopFallback));
  window.addEventListener('keydown', (e)=>{ if(e.code === 'Space'){ e.preventDefault(); startFallback(); }});
  window.addEventListener('keyup', (e)=>{ if(e.code === 'Space'){ e.preventDefault(); stopFallback(); }});

  // kick mic off once the candles page can be seen (after opening)
  let micRequested = false;
  coverWrap.addEventListener('click', () => {
    if(!micRequested){ micRequested = true; initMic(); }
  });

  // ---------------- CONFETTI ----------------
  let confettiPieces = [];
  function resizeCanvas(){
    const rect = confettiCanvas.parentElement.getBoundingClientRect();
    confettiCanvas.width = rect.width; confettiCanvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const confettiColors = ['#8f1d1d','#f3b13a','#f3c6cb','#efe6d8','#c99a6b'];
  function launchConfetti(){
    resizeCanvas();
    confettiPieces = [];
    const count = 90;
    for(let i=0;i<count;i++){
      confettiPieces.push({
        x: Math.random()*confettiCanvas.width,
        y: -20 - Math.random()*confettiCanvas.height*0.5,
        w: 5+Math.random()*5, h: 8+Math.random()*6,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        vy: 2+Math.random()*2.5, vx: -1.2+Math.random()*2.4,
        rot: Math.random()*360, vr: -6+Math.random()*12
      });
    }
    let start = performance.now();
    function frame(t){
      ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
      let anyAlive = false;
      confettiPieces.forEach(p=>{
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if(p.y < confettiCanvas.height + 20) anyAlive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      });
      if(anyAlive && t - start < 6000){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
      }
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
